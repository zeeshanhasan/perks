name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: file:./ci.sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Shopify's own checks for the theme app extension (Liquid, schema). Limits Shopify only enforces at
      # release (script size, header length) are covered by tests/employee-price.test.ts.
      - name: Theme check (theme app extension)
        run: npx --yes @shopify/cli@5.0.2 theme check --path extensions/perks-theme --fail-level error
