query CartInput($collectionIds: [ID!]) {
  cart {
    buyerIdentity {
      isAuthenticated
      customer {
        email
        eligibility: metafield(namespace: "$app", key: "perks_eligibility") {
          value
        }
        usage: metafield(namespace: "$app", key: "perks_usage") {
          value
        }
      }
    }
    lines {
      id
      merchandise {
        __typename
        ... on ProductVariant {
          product {
            id
            vendor
            productType
            inCollections(ids: $collectionIds) {
              collectionId
              isMember
            }
          }
        }
      }
    }
  }
  shop {
    localTime {
      date
    }
  }
  discount {
    discountClasses
    config: metafield(namespace: "$app", key: "perks_config") {
      value
    }
  }
}
