query CartValidationsGenerateRunInput($collectionIds: [ID!]) {
  buyerJourney {
    step
  }
  cart {
    buyerIdentity {
      isAuthenticated
      customer {
        email
        eligibility: metafield(namespace: "$app", key: "perks_eligibility") {
          value
        }
      }
    }
    lines {
      merchandise {
        __typename
        ... on ProductVariant {
          product {
            id
            vendor
            productType
            inCollections(ids: $collectionIds) {
              collectionId
              isMember
            }
            employeeOnly: metafield(namespace: "$app", key: "perks_employee_only") {
              value
            }
          }
        }
      }
    }
  }
  shop {
    localTime {
      date
    }
  }
  validation {
    config: metafield(namespace: "$app", key: "perks_config") {
      value
    }
  }
}
