# PRODUCTION config, generated by scripts/make-prod-config.mjs. Re-run after changing shopify.app.toml.
# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "ffa651a4f68771a6f10dcbe8723c3d59"
application_url = "https://perks.tofoapp.com"
embedded = true
name = "Tofo Perks"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_customers,write_customers,read_products,write_products,read_discounts,write_discounts,read_validations,write_validations"

# --- App-owned metafields (decision 003) -------------------------------------
# The DB is the source of truth; these are the published copy the Functions read.

[customer.metafields.app.perks_eligibility]
type = "json"
name = "Perks eligibility"
description = "Employee perks eligibility, managed by the Tofo Perks app"

  [customer.metafields.app.perks_eligibility.access]
  admin = "merchant_read"
  # Liquid can only read the logged-in customer's own record. Used by the Employee mode embed.
  storefront = "public_read"

[product.metafields.app.perks_employee_only]
type = "boolean"
name = "Perks: employee only"
description = "Only verified employees can buy this product"

  [product.metafields.app.perks_employee_only.access]
  admin = "merchant_read"
  storefront = "public_read"

[product.metafields.app.perks_discounted]
type = "boolean"
name = "Perks: employee discount"
description = "Anyone can buy; verified employees get the employee discount"

  [product.metafields.app.perks_discounted.access]
  admin = "merchant_read"
  storefront = "public_read"

[product.metafields.app.perks_discount_excluded]
type = "boolean"
name = "Perks: excluded from employee discount"
description = "The employee discount never applies to this product"

  [product.metafields.app.perks_discount_excluded.access]
  admin = "merchant_read"

# --- Storefront: app proxy (decision 002) -----------------------------------
# Storefront URL: https://{shop}/apps/perks/*  ->  {application_url}/proxy/*

[app_proxy]
url = "https://perks.tofoapp.com/proxy"
subpath = "perks"
prefix = "apps"

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers"
  topics = [ "customers/create", "customers/update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

[auth]
redirect_urls = [ "https://perks.tofoapp.com/api/auth" ]

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = false
